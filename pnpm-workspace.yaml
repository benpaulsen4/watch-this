# Lifecycle scripts run only for packages listed here as true. Anything new
# that ships one fails the install (strictDepBuilds) until it is reviewed.
#
# esbuild -- install.js validates the platform binary that pnpm installs as
#   an optionalDependency and swaps it in for the JS shim.
# @vercel/speed-insights -- a migration helper that reads .env* files looking
#   for the old VERCEL_ANALYTICS_ID and rewrites the project. Nothing to build,
#   and it has no business reading .env.local.
# unrs-resolver -- `napi-postinstall ... check` only re-verifies the native
#   binding pnpm already installed, and downloads one if it is missing. If it
#   is ever missing, eslint fails loudly, which is preferable to a fetch here.
allowBuilds:
  esbuild: true
  "@vercel/speed-insights": false
  unrs-resolver: false

# Every entry below must earn its place: an override silently violates what a
# dependency declared it can work with, so it is only worth it to reach a
# patched version the tree cannot otherwise resolve.
#
# postcss ^8.5.18 -- load-bearing. Without it the tree also resolves 8.4.31
# and 8.5.15, both inside GHSA-r28c-9q8g-f849 (high, <=8.5.17).
# @types/react, @types/react-dom -- pinned to match the react/react-dom
# versions exactly; React 19 types are not compatible across minors.
#
# SUPPLY-13: brace-expansion is still NOT overridden, and no longer needs
# to be. The versions this tree resolves -- 1.1.21 under eslint's
# minimatch@3 and 5.0.12 under typescript-eslint's minimatch@10 -- are both
# past the fixes for GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895, so
# `pnpm audit` is clean on it without one. An override would still be wrong:
# the 5.x line changed its export from `module.exports = expand` to
# `{ expand }` and eslint's minimatch@3 calls the import directly, so pinning
# ^5 breaks `eslint .` with 'expand is not a function'. Leave it unpinned and
# let each consumer resolve the API it declares.
#
# SUPPLY-04: ajv, @babel/core, flatted, ws and js-yaml were removed because
# the tree resolves to the same patched versions without them. sharp was
# removed for the same reason, but only just: it was load-bearing against
# next 16.2, which declares sharp ^0.34.5 and so resolved 0.34.5, inside
# GHSA-f88m-g3jw-g9cj (high, <0.35.0). next 16.3 declares ^0.35.4 itself,
# next is sharp's only consumer here, and 0.35.4 is also the floor for
# GHSA-rgj7-g3m4-5g8c (high, <0.35.4, bundled libheif) -- so the override no
# longer changes the resolution and cannot earn its place. It has to come
# back if next's ^16.3.6 floor is ever lowered below 16.3. GHSA-wq5f-xc86-pv6w
# (high, <0.35.5, bundled librsvg) has since raised the bar past next's own
# floor: sharp 0.35.5 is inside next's ^0.35.4, so it needs no override, but
# it is held by the LOCKFILE only. source-map-js 1.2.2, which closes
# GHSA-68fv-2mgg-jv7q (high, <1.2.2), is in the same position under every
# postcss's ^1.2.1. picomatch was
# removed for a stronger reason: it forced micromatch (which declares ^2.3.1)
# across two majors to 4.0.4, and micromatch's own resolution is 2.3.2 --
# already the patched version, since the advisories are ranged <2.3.2. It
# bought nothing and violated a declared range.
#
# SUPPLY-05: esbuild is still NOT overridden globally. Four consumers declare
# mutually disjoint ranges (vite ^0.27.0, tsx ~0.28.0, drizzle-kit ^0.25.4,
# @esbuild-kit/core-utils ~0.18.20), so no single version satisfies them and
# any blanket pin violates three of the four. The old ^0.28.1 pin was for
# GHSA-gv7w-rqvm-qjhr, which was WITHDRAWN on 2026-06-17.
#
# What IS pinned is one scoped override: esbuild ^0.25.12 under
# @esbuild-kit/core-utils only, which clears GHSA-67mh-4wv8-2f99 (moderate,
# <=0.24.2) without touching the esbuild that vite, tsx or drizzle-kit
# resolve for themselves. Nothing else can clear it: @esbuild-kit/* is
# deprecated and pinned to esbuild ~0.18.20 forever, drizzle-kit only drops
# the dependency in its 1.0.0 prereleases, and npm's `audit fix --force`
# offered to DOWNGRADE drizzle-kit to 0.18.1. The override is safe because
# drizzle-kit 0.31 declares @esbuild-kit/esm-loader but never imports it --
# it loads configs through tsx -- and because the transform API core-utils
# calls is unchanged between 0.18 and 0.25. pnpm stores esbuild@0.25.12 once,
# so core-utils and drizzle-kit share it. Under npm the hoisted copy cost a
# second set of platform binaries; that cost is gone. Drop it once
# drizzle-kit 1.0 is stable; the 1.0.0-rc line no longer depends on
# @esbuild-kit at all.
#
# GHSA-g7r4-m6w7-qqqr (low, esbuild 0.27.3 - 0.28.0) no longer touches
# vite's path. vite 7.3.7 widened its range to ^0.27.0 || ^0.28.0, so it
# now dedupes onto tsx's esbuild 0.28.1, past the advisory, and the old
# 0.27.2 copy is gone. pnpm picks the highest match, so an update can no
# longer refloat vite into 0.27.3+ the way it could under ^0.27.0 alone.
#
# GHSA-vfj7-8cjw-p6xm (high, braces <=3.0.3) was WITHDRAWN on 2026-10-23,
# so its one remaining path -- @next/eslint-plugin-next, which pins
# fast-glob to exactly 3.3.1 -- no longer needs a note. The other path,
# typescript-eslint 8.46, was closed by moving it to 8.71, which replaced
# fast-glob with tinyglobby; eslint-config-next declares ^8.46.0, so that
# is held by the LOCKFILE only.
#
# minimatch ^11.0.1 under @typescript-eslint/typescript-estree only --
# load-bearing. GHSA-g3hv-75wg-m249 (moderate, >=7.0.0 <11.0.1, globparts
# amplification) has no 10.x backport, and typescript-estree declares
# ^10.2.2 through 8.72 at least. 11.0 kept the exports and API and only
# dropped Node 18 (the tree already needs 20+). eslint's own minimatch@3 is
# outside the range and stays unpinned -- see SUPPLY-13 above for why a
# global minimatch/brace-expansion pin breaks it. Drop this once
# typescript-estree declares ^11.
#
# next ^16.4.1, zod ^4.6.6 and vitest ^4.1.12 are raised in package.json
# rather than overridden: they close GHSA advisories in next (critical,
# <=16.4.0), zod (high, <4.6.6) and @vitest/mocker (<4.1.12). vitest 4.1.12
# also lets vite float to 7.3.7, past the vite advisories (<=7.3.6) -- held
# by the LOCKFILE only, as vitest declares vite ^7 loosely enough to allow
# the vulnerable range. `pnpm audit` should report nothing; anything it
# does report is new.
overrides:
  "@types/react": 19.2.2
  "@types/react-dom": 19.2.2
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  postcss: ^8.5.18
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.1
