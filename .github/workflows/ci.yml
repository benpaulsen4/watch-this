name: CI

# SUPPLY-09: third-party actions are pinned to full commit SHAs, not to the
# floating `@v4` tag. A major tag is mutable -- whoever controls the action
# repository can repoint it at new code, which then runs here with access to the
# checkout and the npm cache. The trailing comment is the version that SHA is,
# so the pin stays readable; update both together.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install
        run: npm ci
      # `npm run lint` rewrites files with --fix, which would let a violation
      # pass here. lint:ci is the non-mutating, warnings-are-errors form.
      - name: Lint
        run: npm run lint:ci

  vitest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install
        run: npm ci
      # Runs the suite with coverage so the thresholds in vitest.config.mts are
      # actually enforced somewhere. They are floors just under current
      # coverage, so this fails on a real regression, not on ordinary churn.
      - name: Test
        run: npm run test:coverage
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # src/lib/db/index.ts throws at module scope when DATABASE_URL is
          # unset, and `next build` evaluates route modules while collecting
          # page data. Nothing connects to a database during the build, so a
          # placeholder is sufficient - and keeps a real credential out of CI.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
