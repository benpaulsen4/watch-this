name: CI

# SUPPLY-09: third-party actions are pinned to full commit SHAs, not to the
# floating `@v4` tag. A major tag is mutable -- whoever controls the action
# repository can repoint it at new code, which then runs here with access to the
# checkout and the pnpm store. The trailing comment is the version that SHA is,
# so the pin stays readable; update both together.
#
# pnpm/action-setup takes no version input: it reads the exact pnpm pin from
# packageManager in package.json, so CI and local installs cannot drift apart.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install
        run: pnpm install --frozen-lockfile
      # `pnpm lint` rewrites files with --fix, which would let a violation
      # pass here. lint:ci is the non-mutating, warnings-are-errors form.
      - name: Lint
        run: pnpm lint:ci

  vitest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install
        run: pnpm install --frozen-lockfile
      # Runs the suite with coverage so the thresholds in vitest.config.mts are
      # actually enforced somewhere. They are floors just under current
      # coverage, so this fails on a real regression, not on ordinary churn.
      - name: Test
        run: pnpm test:coverage
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # src/lib/db/index.ts throws at module scope when DATABASE_URL is
          # unset, and `next build` evaluates route modules while collecting
          # page data. Nothing connects to a database during the build, so a
          # placeholder is sufficient - and keeps a real credential out of CI.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
